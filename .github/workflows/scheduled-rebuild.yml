name: Scheduled rebuild for scheduled posts

# GitHub Pages only rebuilds when something is pushed to main. Posts dated
# in the future stay hidden (see `future: false` in _config.yml) until that
# moment, so this workflow re-triggers a Pages build every 15 minutes to
# pick up any post whose scheduled time has just passed — no manual push
# needed on publish day.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a GitHub Pages build
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
