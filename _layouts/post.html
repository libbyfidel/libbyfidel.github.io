---
layout: default
---
<article class="article">
  <a href="{{ '/#writing' | relative_url }}" class="article-back">← Back to writing</a>
  <div class="article-tag"><span class="post-tag">{{ page.tag | default: "Essay" }}</span></div>
  <h1 class="article-title">{{ page.title }}</h1>
  <div class="article-date">{{ page.date | date: "%B %-d, %Y" }}</div>
  <div class="article-body">
    {{ content }}
  </div>
  {% if page.credit %}
  <p class="article-credit">{{ page.credit }}</p>
  {% endif %}
</article>
