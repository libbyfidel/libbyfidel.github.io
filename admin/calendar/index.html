<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Calendar — Libby Fidel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --cream: #f7f3ec;
      --green-soft: rgba(120,160,90,0.25);
      --green-mid: #4a6040;
      --green-deep: #3a5c2e;
      --text-dark: #1e2a1a;
      --amber: #b07d2a;
      --amber-bg: #fdf6e8;
      --gray: #8a8a80;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--cream); color: var(--text-dark);
      min-height: 100vh;
    }
    header {
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
      padding: 1.25rem 2rem; border-bottom: 1px solid var(--green-soft);
    }
    header a.back { color: var(--green-mid); text-decoration: none; font-size: 14px; }
    header a.back:hover { color: var(--green-deep); }
    header h1 { font-size: 20px; font-weight: 600; }
    .month-nav { display: flex; align-items: center; gap: 0.5rem; margin-left: auto; }
    .month-nav .label { font-size: 16px; font-weight: 600; min-width: 150px; text-align: center; }
    .month-nav button {
      border: 1px solid var(--green-soft); background: white; color: var(--text-dark);
      border-radius: 6px; padding: 0.35rem 0.75rem; font-size: 14px; cursor: pointer;
    }
    .month-nav button:hover { border-color: var(--green-deep); }
    .legend { display: flex; gap: 1rem; padding: 0.75rem 2rem 0; font-size: 12px; color: var(--green-mid); flex-wrap: wrap; align-items: center; }
    .legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
    .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .legend .i-pub { background: var(--green-deep); }
    .legend .i-sch { background: var(--amber); }
    .legend .i-dra { background: var(--gray); }
    .legend .auth { margin-left: auto; }
    .legend .auth.ro { color: var(--amber); }
    main { padding: 1rem 2rem 2.5rem; }
    .grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      border: 1px solid var(--green-soft); border-radius: 10px; overflow: hidden; background: white;
    }
    .dow {
      padding: 0.5rem; text-align: center; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--green-mid);
      background: #f2eee5; border-bottom: 1px solid var(--green-soft);
    }
    .day {
      min-height: 108px; padding: 0.4rem; border-right: 1px solid rgba(120,160,90,0.12);
      border-bottom: 1px solid rgba(120,160,90,0.12); background: white;
      display: flex; flex-direction: column; gap: 3px;
    }
    .day:nth-child(7n) { border-right: none; }
    .day.other { background: #faf8f3; }
    .day.other .num { color: #b8b4a8; }
    .day .num { font-size: 12px; color: var(--green-mid); margin-bottom: 2px; }
    .day.today .num {
      background: var(--green-deep); color: white; border-radius: 50%;
      width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
      font-weight: 600;
    }
    .day.dropover { outline: 2px dashed var(--green-deep); outline-offset: -3px; background: #f0f4ea; }
    .chip {
      font-size: 12px; line-height: 1.3; padding: 4px 7px; border-radius: 6px;
      cursor: pointer; user-select: none;
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      border: 1px solid transparent;
    }
    .chip[draggable="true"] { cursor: grab; }
    .chip.dragging { opacity: 0.4; }
    .chip.published { background: #eaf1e4; border-color: rgba(58,92,46,0.35); color: var(--green-deep); }
    .chip.scheduled { background: var(--amber-bg); border-color: rgba(176,125,42,0.4); color: var(--amber); }
    .chip.draft { background: #f0efec; border-color: #d5d3cc; color: var(--gray); }
    .chip:hover { filter: brightness(0.96); }
    .status-msg { padding: 3rem; text-align: center; color: var(--green-mid); }

    /* token prompt */
    .token-bar {
      margin: 0 2rem; padding: 0.75rem 1rem; background: var(--amber-bg);
      border: 1px solid rgba(176,125,42,0.4); border-radius: 8px; font-size: 13px;
      display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; color: var(--amber);
    }
    .token-bar input {
      flex: 1; min-width: 200px; padding: 0.35rem 0.6rem; border: 1px solid var(--green-soft);
      border-radius: 6px; font-size: 13px;
    }
    .token-bar button {
      border: none; background: var(--green-deep); color: white; border-radius: 6px;
      padding: 0.4rem 0.9rem; font-size: 13px; cursor: pointer;
    }

    /* modal */
    .overlay {
      position: fixed; inset: 0; background: rgba(30,42,26,0.45);
      display: none; align-items: flex-start; justify-content: center; padding: 4vh 1rem; z-index: 50;
      overflow-y: auto;
    }
    .overlay.open { display: flex; }
    .modal {
      background: white; border-radius: 12px; max-width: 720px; width: 100%;
      padding: 2rem 2.25rem 2.5rem; position: relative;
    }
    .modal .close {
      position: absolute; top: 0.9rem; right: 1rem; border: none; background: none;
      font-size: 22px; color: var(--green-mid); cursor: pointer; line-height: 1;
    }
    .modal .meta { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
    .modal .pill {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 3px 9px; border-radius: 99px;
    }
    .pill.published { background: #eaf1e4; color: var(--green-deep); }
    .pill.scheduled { background: var(--amber-bg); color: var(--amber); }
    .pill.draft { background: #f0efec; color: var(--gray); }
    .pill.tag { background: #f2eee5; color: var(--green-mid); text-transform: none; letter-spacing: 0; font-weight: 500; }
    .modal .date { font-size: 13px; color: var(--green-mid); }
    .modal h2 { font-size: 24px; margin-bottom: 0.35rem; color: var(--green-deep); }
    .modal .excerpt { font-size: 14px; color: var(--green-mid); font-style: italic; margin-bottom: 1.25rem; }
    .modal .edit-link {
      display: inline-block; margin-bottom: 1.25rem; font-size: 13px; color: var(--green-deep);
    }
    .modal .body { border-top: 1px solid var(--green-soft); padding-top: 1.25rem; font-size: 15px; line-height: 1.7; }
    .modal .body h1, .modal .body h2, .modal .body h3 { margin: 1.2em 0 0.4em; color: var(--green-deep); }
    .modal .body p, .modal .body ul, .modal .body ol { margin-bottom: 0.9em; }
    .modal .body ul, .modal .body ol { padding-left: 1.4em; }
    .modal .body img { max-width: 100%; border-radius: 8px; }
    .modal .body a { color: var(--green-deep); }
    .modal .body blockquote { border-left: 3px solid var(--green-soft); padding-left: 1em; color: var(--green-mid); margin-bottom: 0.9em; }
    .modal .credit { margin-top: 1.5rem; font-size: 12.5px; color: var(--gray); font-style: italic; }

    /* toast */
    .toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      background: var(--text-dark); color: white; padding: 0.6rem 1.2rem; border-radius: 8px;
      font-size: 13.5px; display: none; z-index: 60; max-width: 90vw;
    }
    .toast.show { display: block; }
    .toast.error { background: #7a2e2e; }

    @media (max-width: 700px) {
      header, main { padding-left: 1rem; padding-right: 1rem; }
      .legend { padding-left: 1rem; padding-right: 1rem; }
      .day { min-height: 76px; }
      .chip { -webkit-line-clamp: 1; }
    }
  </style>
</head>
<body>
  <header>
    <a class="back" href="../">&larr; Dashboard</a>
    <h1>Content Calendar</h1>
    <div class="month-nav">
      <button id="prev" aria-label="Previous month">&larr;</button>
      <button id="todayBtn">Today</button>
      <button id="next" aria-label="Next month">&rarr;</button>
      <div class="label" id="monthLabel"></div>
    </div>
  </header>

  <div class="legend">
    <span><i class="i-pub"></i> Published</span>
    <span><i class="i-sch"></i> Scheduled</span>
    <span><i class="i-dra"></i> Draft</span>
    <span id="authState" class="auth"></span>
  </div>

  <div class="token-bar" id="tokenBar" style="display:none">
    <span>Read-only — log in to the <a href="../cms/" style="color:inherit">CMS</a> first (recommended), or paste a GitHub token to enable drag-to-reschedule:</span>
    <input id="tokenInput" type="password" placeholder="GitHub personal access token" />
    <button id="tokenSave">Save</button>
  </div>

  <main>
    <div class="grid" id="grid"></div>
    <div class="status-msg" id="statusMsg">Loading posts…</div>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="close" id="modalClose" aria-label="Close">&times;</button>
      <div class="meta" id="modalMeta"></div>
      <h2 id="modalTitle"></h2>
      <p class="excerpt" id="modalExcerpt"></p>
      <a class="edit-link" id="modalEdit" href="#">Edit in CMS &rarr;</a>
      <div class="body" id="modalBody"></div>
      <p class="credit" id="modalCredit"></p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/marked@12/marked.min.js"></script>
  <script>
    const REPO = 'libbyfidel/libbyfidel.github.io';
    const BRANCH = 'main';
    const API = 'https://api.github.com/repos/' + REPO + '/contents/';
    const TOKEN_KEY = 'content-calendar-gh-token';

    const $ = (id) => document.getElementById(id);
    const state = {
      posts: [],          // { name, sha, raw, fm, body, dateStr, effective, status }
      view: new Date(),   // any date within the displayed month
      token: null,
      busy: false,
    };

    /* ---------- auth ---------- */
    function findToken() {
      // Reuse the token Decap CMS stores after GitHub login (same origin).
      for (const key of ['decap-cms-user', 'netlify-cms-user']) {
        try {
          const u = JSON.parse(localStorage.getItem(key) || 'null');
          if (u && u.token) return u.token;
        } catch (e) { /* ignore */ }
      }
      return localStorage.getItem(TOKEN_KEY) || null;
    }

    function ghHeaders() {
      const h = { Accept: 'application/vnd.github+json' };
      if (state.token) h.Authorization = 'Bearer ' + state.token;
      return h;
    }

    /* ---------- utf-8 safe base64 ---------- */
    function b64decode(b64) {
      const bin = atob(b64.replace(/\s/g, ''));
      return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
    }
    function b64encode(str) {
      let bin = '';
      new TextEncoder().encode(str).forEach(b => { bin += String.fromCharCode(b); });
      return btoa(bin);
    }

    /* ---------- frontmatter ---------- */
    function parsePost(name, raw) {
      const m = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
      const fm = {};
      let body = raw;
      if (m) {
        body = m[2];
        for (const line of m[1].split(/\r?\n/)) {
          const kv = line.match(/^(\w[\w-]*):\s*(.*)$/);
          if (!kv) continue;
          let v = kv[2].trim();
          if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) v = v.slice(1, -1);
          fm[kv[1]] = v;
        }
      }
      // Date: frontmatter `date` wins, else the filename prefix.
      const fromName = name.match(/^(\d{4})-(\d{2})-(\d{2})-/);
      let dateStr = fromName ? fromName[1] + '-' + fromName[2] + '-' + fromName[3] : null;
      let effective = dateStr ? new Date(+fromName[1], +fromName[2] - 1, +fromName[3]) : null;
      if (fm.date) {
        const d = fm.date.match(/(\d{4})-(\d{2})-(\d{2})/);
        if (d) {
          dateStr = d[1] + '-' + d[2] + '-' + d[3];
          const parsed = new Date(fm.date.replace(' ', 'T').replace(/T(\d{2}:\d{2}:\d{2})\s*([+-]\d{4})$/, 'T$1$2'));
          effective = isNaN(parsed) ? new Date(+d[1], +d[2] - 1, +d[3]) : parsed;
        }
      }
      let status = 'published';
      if (String(fm.published).toLowerCase() === 'false') status = 'draft';
      else if (effective && effective > new Date()) status = 'scheduled';
      return { name, raw, fm, body, dateStr, effective, status };
    }

    /* ---------- load ---------- */
    async function loadPosts() {
      $('statusMsg').style.display = 'block';
      $('statusMsg').textContent = 'Loading posts…';
      try {
        const res = await fetch(API + '_posts?ref=' + BRANCH, { headers: ghHeaders() });
        if (!res.ok) throw new Error('GitHub API: ' + res.status);
        const listing = await res.json();
        const files = listing.filter(f => f.type === 'file' && /\.(md|markdown)$/.test(f.name));
        state.posts = await Promise.all(files.map(async f => {
          const r = await fetch(API + '_posts/' + encodeURIComponent(f.name) + '?ref=' + BRANCH, { headers: ghHeaders() });
          if (!r.ok) throw new Error('GitHub API: ' + r.status + ' on ' + f.name);
          const j = await r.json();
          const post = parsePost(f.name, b64decode(j.content));
          post.sha = j.sha;
          return post;
        }));
        $('statusMsg').style.display = 'none';
        render();
      } catch (e) {
        $('statusMsg').textContent = 'Could not load posts — ' + e.message +
          (state.token ? '' : ' (you may be rate-limited; log in via the CMS or paste a token above)');
      }
    }

    /* ---------- calendar ---------- */
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DOWS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const pad = n => String(n).padStart(2, '0');
    const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

    function render() {
      const y = state.view.getFullYear(), mo = state.view.getMonth();
      $('monthLabel').textContent = MONTHS[mo] + ' ' + y;

      const byDay = {};
      for (const p of state.posts) {
        if (!p.dateStr) continue;
        (byDay[p.dateStr] = byDay[p.dateStr] || []).push(p);
      }

      const grid = $('grid');
      grid.innerHTML = '';
      for (const d of DOWS) {
        const el = document.createElement('div');
        el.className = 'dow'; el.textContent = d;
        grid.appendChild(el);
      }

      const first = new Date(y, mo, 1);
      const start = new Date(y, mo, 1 - first.getDay());
      const todayKey = keyOf(new Date());
      for (let i = 0; i < 42; i++) {
        const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        const dk = keyOf(d);
        const cell = document.createElement('div');
        cell.className = 'day' + (d.getMonth() !== mo ? ' other' : '') + (dk === todayKey ? ' today' : '');
        cell.dataset.date = dk;
        const num = document.createElement('span');
        num.className = 'num'; num.textContent = d.getDate();
        cell.appendChild(num);

        for (const p of (byDay[dk] || []).sort((a, b) => a.name.localeCompare(b.name))) {
          cell.appendChild(makeChip(p));
        }

        cell.addEventListener('dragover', ev => {
          if (!state.token || state.busy) return;
          ev.preventDefault();
          cell.classList.add('dropover');
        });
        cell.addEventListener('dragleave', () => cell.classList.remove('dropover'));
        cell.addEventListener('drop', ev => {
          ev.preventDefault();
          cell.classList.remove('dropover');
          const name = ev.dataTransfer.getData('text/plain');
          if (name) movePost(name, dk);
        });
        grid.appendChild(cell);
      }
    }

    function makeChip(p) {
      const chip = document.createElement('div');
      chip.className = 'chip ' + p.status;
      chip.textContent = (p.fm.title || p.name);
      chip.title = (p.fm.title || p.name) + ' — ' + p.status + (state.token ? ' (drag to reschedule, click to read)' : '');
      chip.draggable = !!state.token && !state.busy;
      chip.addEventListener('click', () => openModal(p));
      chip.addEventListener('dragstart', ev => {
        ev.dataTransfer.setData('text/plain', p.name);
        ev.dataTransfer.effectAllowed = 'move';
        chip.classList.add('dragging');
      });
      chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
      return chip;
    }

    /* ---------- reschedule (rename + frontmatter date) ---------- */
    async function movePost(name, newDate) {
      const post = state.posts.find(p => p.name === name);
      if (!post || post.dateStr === newDate) return;

      const newName = post.name.replace(/^\d{4}-\d{2}-\d{2}-/, newDate + '-');
      if (newName !== post.name && state.posts.some(p => p.name === newName)) {
        return toast('A post with that filename already exists on ' + newDate, true);
      }

      // Update the frontmatter `date:` (keep the time part) if the post has one.
      let raw = post.raw;
      const fmMatch = raw.match(/^---\r?\n[\s\S]*?\r?\n---/);
      if (fmMatch && /^date:/m.test(fmMatch[0])) {
        const updatedFm = fmMatch[0].replace(/^(date:\s*["']?)\d{4}-\d{2}-\d{2}/m, '$1' + newDate);
        raw = updatedFm + raw.slice(fmMatch[0].length);
      }

      state.busy = true;
      toast('Rescheduling “' + (post.fm.title || post.name) + '” to ' + newDate + '…');
      try {
        const put = await fetch(API + '_posts/' + encodeURIComponent(newName), {
          method: 'PUT',
          headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: 'Reschedule ' + post.name + ' to ' + newDate + ' (content calendar)',
            content: b64encode(raw),
            branch: BRANCH,
            ...(newName === post.name ? { sha: post.sha } : {}),
          }),
        });
        if (!put.ok) throw new Error('create failed (' + put.status + ')');
        const putJson = await put.json();

        if (newName !== post.name) {
          const del = await fetch(API + '_posts/' + encodeURIComponent(post.name), {
            method: 'DELETE',
            headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: 'Remove old date for ' + newName + ' (content calendar)',
              sha: post.sha,
              branch: BRANCH,
            }),
          });
          if (!del.ok) throw new Error('cleanup of old file failed (' + del.status + ') — check the repo for a duplicate');
        }

        Object.assign(post, parsePost(newName, raw));
        post.sha = putJson.content.sha;
        toast('Moved to ' + newDate + ' ✓');
      } catch (e) {
        toast('Reschedule failed: ' + e.message, true);
      } finally {
        state.busy = false;
        render();
      }
    }

    /* ---------- modal ---------- */
    function openModal(p) {
      const meta = $('modalMeta');
      meta.innerHTML = '';
      const st = document.createElement('span');
      st.className = 'pill ' + p.status; st.textContent = p.status;
      meta.appendChild(st);
      if (p.fm.tag) {
        const tg = document.createElement('span');
        tg.className = 'pill tag'; tg.textContent = p.fm.tag;
        meta.appendChild(tg);
      }
      const dt = document.createElement('span');
      dt.className = 'date';
      dt.textContent = p.effective ? p.effective.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) : '';
      meta.appendChild(dt);

      $('modalTitle').textContent = p.fm.title || p.name;
      $('modalExcerpt').textContent = p.fm.excerpt || '';
      $('modalExcerpt').style.display = p.fm.excerpt ? '' : 'none';
      $('modalEdit').href = '../cms/#/collections/posts/entries/' + p.name.replace(/\.(md|markdown)$/, '');
      $('modalBody').innerHTML = marked.parse(p.body);
      $('modalCredit').textContent = p.fm.credit || '';
      $('overlay').classList.add('open');
    }
    $('modalClose').addEventListener('click', () => $('overlay').classList.remove('open'));
    $('overlay').addEventListener('click', ev => { if (ev.target === $('overlay')) $('overlay').classList.remove('open'); });
    document.addEventListener('keydown', ev => { if (ev.key === 'Escape') $('overlay').classList.remove('open'); });

    /* ---------- toast ---------- */
    let toastTimer;
    function toast(msg, isError) {
      const t = $('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), isError ? 6000 : 3000);
    }

    /* ---------- nav + init ---------- */
    $('prev').addEventListener('click', () => { state.view = new Date(state.view.getFullYear(), state.view.getMonth() - 1, 1); render(); });
    $('next').addEventListener('click', () => { state.view = new Date(state.view.getFullYear(), state.view.getMonth() + 1, 1); render(); });
    $('todayBtn').addEventListener('click', () => { state.view = new Date(); render(); });
    $('tokenSave').addEventListener('click', () => {
      const v = $('tokenInput').value.trim();
      if (!v) return;
      localStorage.setItem(TOKEN_KEY, v);
      state.token = v;
      updateAuthUI();
      loadPosts();
    });

    function updateAuthUI() {
      if (state.token) {
        $('authState').textContent = 'Editing enabled — drag posts to reschedule';
        $('authState').className = 'auth';
        $('tokenBar').style.display = 'none';
      } else {
        $('authState').textContent = 'Read-only';
        $('authState').className = 'auth ro';
        $('tokenBar').style.display = 'flex';
      }
    }

    state.token = findToken();
    updateAuthUI();
    loadPosts();
  </script>
</body>
</html>
